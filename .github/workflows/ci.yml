name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff "bandit[toml]"
      - name: Ruff
        run: ruff check .
      - name: Bandit (high severity)
        run: bandit -c pyproject.toml -r fusionlib -lll

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # The core test suite needs pytest, uvicorn, and websockets. GUI dependencies (pywebview/Pillow)
        # are not required for the web/security tests and are skipped to keep CI fast and headless.
        run: python -m pip install --upgrade pip "pytest>=8" "pytest-cov>=5" "uvicorn>=0.30" "websockets>=12"
      - name: Run tests
        env:
          PYFUSION_SECRET_KEY: ci-test-secret-key-0123456789abcdef0123456789abcdef
        run: python -m pytest --cov=fusionlib --cov-report=term-missing

  css-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Verify compiled Tailwind + daisyUI CSS bundle
        run: |
          npm ci
          npm run build:css
          test -s web/assets/app.css

  build:
    needs: [test, css-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

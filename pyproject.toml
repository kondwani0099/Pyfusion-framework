[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfusion-framework"
dynamic = ["version"]
description = "Vue-style Single-File Components for Python: reactive web, desktop and mobile apps from one codebase."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kondwani Nyirenda" }]
requires-python = ">=3.10"
keywords = ["web framework", "reactive", "single-file components", "vue", "desktop", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "Pillow>=10.0.0",
    "pywebview>=5.0.0",
    "requests>=2.31.0",
    "tkhtmlview>=0.2.0",
]

[project.optional-dependencies]
security = ["nh3>=0.2.14"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/kondwani0099/pyfusion-framework"
Source = "https://github.com/kondwani0099/pyfusion-framework"
Issues = "https://github.com/kondwani0099/pyfusion-framework/issues"
Changelog = "https://github.com/kondwani0099/pyfusion-framework/blob/main/CHANGELOG.md"
Security = "https://github.com/kondwani0099/pyfusion-framework/security/policy"

[project.scripts]
pyfusion = "fusionlib.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fusionlib._version.__version__" }

[tool.setuptools.packages.find]
include = ["fusionlib*"]

[tool.setuptools.package-data]
fusionlib = ["icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["env", "venv", ".venv", "build", "dist", "desktop", "mobile"]

[tool.ruff.lint]
# Start with correctness rules (syntax errors, undefined names); widen gradually.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"fusionlib/__init__.py" = ["F401"]

[tool.bandit]
exclude_dirs = ["tests", "env", "venv", ".venv"]

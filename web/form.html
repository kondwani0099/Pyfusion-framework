<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission — PyFusion Framework</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.5.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-base-300 text-base-content min-h-screen flex flex-col">
    <header class="navbar bg-base-100/90 backdrop-blur border-b border-base-content/10 px-4 lg:px-8">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl font-bold gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                <span>PyFusion</span>
            </a>
        </div>
        <div class="flex-none gap-2">
            <a href="/" class="btn btn-sm btn-ghost">← Home</a>
            <a href="/counter" class="btn btn-sm btn-outline">Counter SFC</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="card bg-base-100 shadow-2xl border border-base-content/10 w-full max-w-md">
            <div class="card-body">
                <span class="badge badge-emerald bg-emerald-500/20 text-emerald-400 border-emerald-500/30 mb-1">POST /submit_form</span>
                <h1 class="card-title text-2xl font-bold">Sample Form</h1>
                <p class="text-sm opacity-75 mb-4">Submit credentials directly to the PyFusion backend route handler.</p>

                <form action="/submit_form" method="post" class="space-y-4">
                    <div class="form-control">
                        <label class="label" for="username">
                            <span class="label-text font-medium">Username</span>
                        </label>
                        <input type="text" id="username" name="username" placeholder="Enter username" class="input input-bordered w-full" required />
                    </div>

                    <div class="form-control">
                        <label class="label" for="password">
                            <span class="label-text font-medium">Password</span>
                        </label>
                        <input type="password" id="password" name="password" placeholder="Enter password" class="input input-bordered w-full" required />
                    </div>

                    <div class="card-actions justify-end pt-3">
                        <a href="/" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn bg-emerald-600 hover:bg-emerald-500 text-white border-none px-6">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
